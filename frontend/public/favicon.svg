<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="#111111" stroke="#333333" stroke-width="2"/>
  
  <g transform="translate(60, 56) scale(1.1)" filter="url(#glow)">
    <!-- Stylized "A" -->
    <path d="M0 -25 L25 25 L12 25 L0 0 L-12 25 L-25 25 Z" fill="url(#grad1)"/>
    <!-- Center geometric eye/dot -->
    <circle cx="0" cy="8" r="4" fill="#ffffff"/>
  </g>
</svg>
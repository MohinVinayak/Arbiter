version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Persist the SQLite database file across container restarts
      - sqlite_data:/app/data
    environment:
      # Override DATABASE_URL to write into the persistent volume
      DATABASE_URL: sqlite:////app/data/evalforge.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
